supported_languages: [zh]
global_regex_flags: 26
recognizers:
  - name: SpacyRecognizer
    supported_languages: [zh]
    type: predefined
  - name: EmailRecognizer
    supported_languages: [zh]
    type: predefined
  - name: PhoneRecognizer
    supported_languages: [zh]
    supported_regions: [TW]
    type: predefined
  - name: TwNationalIdRecognizer
    supported_language: zh
    supported_entity: TW_NATIONAL_ID
    type: custom
    patterns:
      - name: tw_id
        regex: '(?<![A-Za-z0-9])[A-Z][12489]\d{8}(?![0-9])'
        score: 0.9
  - name: TwMobileRecognizer
    supported_language: zh
    supported_entity: PHONE_NUMBER
    type: custom
    patterns:
      - name: tw_mobile
        regex: '(?<!\d)09\d{2}[- ]?\d{3}[- ]?\d{3}(?!\d)'
        score: 0.85
