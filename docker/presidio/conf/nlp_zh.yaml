nlp_engine_name: spacy
models:
  - lang_code: zh
    model_name: zh_core_web_sm
ner_model_configuration:
  model_to_presidio_entity_mapping:
    PERSON: PERSON
    GPE: LOCATION
    LOC: LOCATION
    FAC: LOCATION
    ORG: ORGANIZATION
  low_confidence_score_multiplier: 0.4
  low_score_entity_names: [ORG, ORGANIZATION]
  labels_to_ignore: [CARDINAL, ORDINAL, QUANTITY, MONEY, PERCENT, DATE, TIME, NORP, WORK_OF_ART, EVENT, LANGUAGE, PRODUCT, LAW]
