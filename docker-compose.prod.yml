name: edulog

services:
  edulog:
    networks:
      - frontend
    # The only public application entrypoint in production.
    ports:
      - "${EDULOG_PORT:-4173}:4173"
      - "${EDULOG_HTTPS_PORT:-4174}:4174"

  api:
    image: ${EDULOG_API_IMAGE:-ghcr.io/kenny1203520/edulog-api:latest}
    networks:
      - frontend
      - net
    # Express is reachable only from the internal frontend network.
    expose:
      - "3000"

  kong:
    ports: !reset []

  analytics:
    ports: !reset []

  supavisor:
    ports: !reset []
