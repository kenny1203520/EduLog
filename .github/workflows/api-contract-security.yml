name: api-contract-security

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/api-contract-security.yml'
  push:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  deno-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v1
        with:
          deno-version: v1.x
      - name: Run migration and security static tests
        run: >-
          deno test --allow-read
          supabase/tests/migration_chain_static_test.ts
          supabase/tests/core_rls_fixture_static_test.ts
          supabase/tests/teacher_permission_migration_static_test.ts
          supabase/tests/migration_hardening_static_test.ts
          supabase/tests/frontend_runtime_config_static_test.ts
          supabase/tests/rate_limit_static_test.ts
          supabase/tests/database_linter_static_test.ts
      - name: Verify Caddy runtime authentication query redaction
        run: bash supabase/tests/caddy_runtime_log_redaction_test.sh
