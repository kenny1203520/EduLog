name: API service and deployment

on:
  push:
    paths:
      - 'server/**'
      - 'app/nginx/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/api-service.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'app/nginx/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/api-service.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        env:
          EDULOG_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
          ANON_KEY: test-anon-key
          SERVICE_ROLE_KEY: test-service-role-key
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Verify Nginx API precedence and SPA fallback
        shell: bash
        run: |
          test "$(grep -n 'location \^~ /api/' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh | head -1 | cut -d: -f1)" -lt "$(grep -n 'location / {' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh | head -1 | cut -d: -f1)"
          grep -q 'proxy_pass http://\$api_upstream' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh
          grep -q 'try_files \\$uri \\$uri/ /index.html' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh
          ! grep -R --binary-files=without-match -E 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|service_role' app/dist 2>/dev/null || true
