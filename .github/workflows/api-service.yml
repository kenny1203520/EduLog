name: API service and deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'app/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/api-service.yml'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/release/**'
      - '.github/releases/**'
      - 'CHANGELOG.md'
  pull_request:
    paths:
      - 'server/**'
      - 'app/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/api-service.yml'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/release/**'
      - '.github/releases/**'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Test tag release automation
        run: node --test scripts/release/release.test.mjs
      - name: Validate production compose
        env:
          EDULOG_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
          ANON_KEY: test-anon-key
          SERVICE_ROLE_KEY: test-service-role-key
          DOCKER_SOCKET_LOCATION: /var/run/docker.sock
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Assert Node 26 API runtime
        shell: bash
        run: |
          grep -q '"node": ">=26"' server/package.json
          grep -q 'node:26' server/Dockerfile
      - name: Scan frontend source boundary
        shell: bash
        run: |
          ! grep -R --exclude='*.spec.*' --binary-files=without-match -E 'supabase\.(from|rpc|functions|channel|storage)|@supabase/supabase-js|VITE_SUPABASE_URL|VITE_SUPABASE_ANON_KEY|VITE_SUPABASE_FUNCTIONS_BASE_URL' app/src

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix app
      - name: Run frontend tests
        run: npm test --prefix app -- --run
      - name: Build frontend
        run: npm run build --prefix app
      - name: Verify Nginx API precedence and SPA fallback
        shell: bash
        run: |
          test "$(grep -n 'location \^~ /api/' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh | head -1 | cut -d: -f1)" -lt "$(grep -n 'location / {' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh | head -1 | cut -d: -f1)"
          grep -q 'proxy_pass http://\$api_upstream' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh
          grep -q 'try_files \\$uri \\$uri/ /index.html' app/nginx/docker-entrypoint.d/05-edulog-runtime.envsh
          ! grep -R --binary-files=without-match -E 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|service_role|VITE_SUPABASE_URL|VITE_SUPABASE_ANON_KEY|VITE_SUPABASE_FUNCTIONS_BASE_URL|functions/v1' app/dist
