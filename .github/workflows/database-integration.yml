name: database-integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/database-integration.yml'
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  migration-and-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edulog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d edulog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: edulog_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Supabase-compatible schemas
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/postgres_bootstrap.sql
      - name: Clean-install migration and RLS gate
        shell: bash
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migration_chain_integration.sql
      - name: Reconciliation migrations are rerunnable
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000043_teaching_scope_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000044_rbac_epoch_and_api_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000045_missing_core_rls_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000046_api_rate_limit_shared_store.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000047_canonical_teacher_permissions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000048_student_scope_course_fallback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000049_holiday_scope_rls_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000050_scope_integrity_and_session_rpc.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000051_child_scope_write_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000052_transfer_scope_authorization.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000053_enrollment_scope_and_student_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000054_rbac_teaching_scope_rpc.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000055_idempotency_route_binding.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000056_canonical_rbac_policy_scope_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000057_holiday_read_permission_alias.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000058_teaching_role_scope_isolation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000059_idempotency_key_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000060_permission_scope_and_session_regression.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000061_scope_and_idempotency_concurrency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rate_limit_integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/core_rls_security.sql
      - name: Upgrade an existing database and verify owner backfill
        shell: bash
        run: |
          createdb edulog_upgrade
          export PGDATABASE=edulog_upgrade
          psql -v ON_ERROR_STOP=1 -f supabase/tests/postgres_bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            case "$migration" in
              *1000043_teaching_scope_reconciliation.sql|*1000044_rbac_epoch_and_api_contract.sql|*1000045_missing_core_rls_hardening.sql|*1000046_api_rate_limit_shared_store.sql|*1000047_canonical_teacher_permissions.sql|*1000048_student_scope_course_fallback.sql|*1000049_holiday_scope_rls_hardening.sql|*1000050_scope_integrity_and_session_rpc.sql|*1000051_child_scope_write_hardening.sql|*1000052_transfer_scope_authorization.sql|*1000053_enrollment_scope_and_student_guard.sql|*1000054_rbac_teaching_scope_rpc.sql|*1000055_idempotency_route_binding.sql|*1000056_canonical_rbac_policy_scope_rls.sql|*1000057_holiday_read_permission_alias.sql|*1000058_teaching_role_scope_isolation.sql|*1000059_idempotency_key_contract.sql|*1000060_permission_scope_and_session_regression.sql|*1000061_scope_and_idempotency_concurrency.sql) continue ;;
            esac
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migration_upgrade_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000043_teaching_scope_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000044_rbac_epoch_and_api_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000045_missing_core_rls_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000046_api_rate_limit_shared_store.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000047_canonical_teacher_permissions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000048_student_scope_course_fallback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000049_holiday_scope_rls_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000050_scope_integrity_and_session_rpc.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000051_child_scope_write_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000052_transfer_scope_authorization.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000053_enrollment_scope_and_student_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000054_rbac_teaching_scope_rpc.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000055_idempotency_route_binding.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000056_canonical_rbac_policy_scope_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000057_holiday_read_permission_alias.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000058_teaching_role_scope_isolation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000059_idempotency_key_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000060_permission_scope_and_session_regression.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/1000061_scope_and_idempotency_concurrency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rate_limit_integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migration_upgrade_assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/core_rls_security.sql
