name: Docker Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        default: v2.0.0-alpha.2

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  API_IMAGE_NAME: ghcr.io/kenny1203520/edulog-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate release tag and package version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      major: ${{ steps.validate.outputs.major }}
      minor: ${{ steps.validate.outputs.minor }}
      stable: ${{ steps.validate.outputs.stable }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Validate SemVer tag and app version
        id: validate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release/release.mjs validate "$RELEASE_TAG"

  database:
    needs: [validate]
    uses: ./.github/workflows/database-integration.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  security:
    needs: [validate]
    uses: ./.github/workflows/api-contract-security.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  quality:
    needs: [validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          # No dependency cache: a release build must not restore files that
          # another workflow run could have written.

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Type-check and build production application
        run: npm run build

      - name: Validate API service build and tests
        working-directory: ./server
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test -- --run
          npm run build

  build:
    needs: [validate, quality, database, security]
    runs-on: ubuntu-latest
    outputs:
      frontend_digest: ${{ steps.build-and-push-frontend.outputs.digest }}
      api_digest: ${{ steps.build-and-push-api.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.stable }}
            type=raw,value=${{ needs.validate.outputs.major }},enable=${{ needs.validate.outputs.stable }}
            type=raw,value=${{ needs.validate.outputs.minor }},enable=${{ needs.validate.outputs.stable }}

      - name: Extract API Docker metadata
        id: meta-api
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.API_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.stable }}
            type=raw,value=${{ needs.validate.outputs.major }},enable=${{ needs.validate.outputs.stable }}
            type=raw,value=${{ needs.validate.outputs.minor }},enable=${{ needs.validate.outputs.stable }}

      - name: Build frontend image for smoke testing
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./app
          load: true
          tags: edulog-release-smoke:frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image for smoke testing
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./server
          load: true
          tags: edulog-release-smoke:api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images before publication
        shell: bash
        run: bash scripts/release-image-smoke.sh

      - name: Build and push frontend Docker image
        id: build-and-push-frontend
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API Docker image
        id: build-and-push-api
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Create release and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.commit }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/release/release.mjs publish "$RELEASE_TAG"
