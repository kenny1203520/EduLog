version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      app-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /extension
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      extension-minor-and-patch:
        update-types:
          - minor
          - patch

  # Root tooling (Playwright for the extension browser tests).
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      root-minor-and-patch:
        update-types:
          - minor
          - patch

  # Docker base images for the published release images.
  - package-ecosystem: docker
    directories:
      - /app
      - /server
      - /docker/presidio
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
