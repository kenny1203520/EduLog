version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      app-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /extension
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      extension-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
