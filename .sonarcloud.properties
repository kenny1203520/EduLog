# These anonymized HTML snapshots preserve an external provider's DOM for parser tests.
# Keep the fixtures unchanged and exclude third-party markup from source-code analysis.
sonar.exclusions=extension/tests/fixtures/**

# Migrations are an append-only chain and repeat policy definitions on purpose;
# they stay in bug and security analysis but are left out of duplication checks.
sonar.cpd.exclusions=supabase/migrations/**
