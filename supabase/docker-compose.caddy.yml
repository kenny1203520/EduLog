services:

  # By default, Kong is used as the API gateway and its ports/env are reset
  # below so Caddy can terminate TLS in front of it.
  #
  # When running Envoy instead, e.g.:
  #   docker compose -f docker-compose.yml -f docker-compose.envoy.yml \
  #                  -f docker-compose.caddy.yml up -d
  # comment out the `kong:` block below and uncomment the `api-gw:` block
  # (and the matching `depends_on` entry further down) so Caddy sits in front
  # of Envoy rather than Kong.

  #api-gw:
  #  ports: !reset []

  kong:
    ports: !reset []
    environment:
      KONG_PORT_MAPS: "443:8000,443:8443"

  edulog:
    ports: !reset []

  caddy:
    container_name: supabase-caddy
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      #api-gw:
      #  condition: service_healthy
      kong:
        condition: service_healthy
      studio:
        condition: service_healthy
      edulog:
        condition: service_started
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN}
      EDULOG_PROXY_DOMAIN: ${EDULOG_PROXY_DOMAIN}
      EDULOG_PROXY_UPSTREAM_URL: ${EDULOG_PROXY_UPSTREAM_URL:-http://edulog:4173}
      EDULOG_HSTS_HEADER: "${EDULOG_HSTS_HEADER:-max-age=31536000; includeSubDomains; preload}"
      EDULOG_CSP_HEADER: "${EDULOG_CSP_HEADER:-default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests}"
      PROXY_AUTH_USERNAME: ${DASHBOARD_USERNAME}
      PROXY_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
    networks:
      - edulog
    command:
      - /bin/sh
      - -c
      - |
        PROXY_AUTH_PASSWORD=$$(caddy hash-password --plaintext "$$PROXY_AUTH_PASSWORD") && \
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./volumes/proxy/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  edulog:
    external: false
