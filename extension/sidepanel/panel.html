<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduLog</title><link rel="stylesheet" href="../styles/edulog-tokens.css"><link rel="stylesheet" href="./panel.css"></head><body>
<header class="panel-head">
  <span class="logo" aria-hidden="true">E</span>
  <div class="heading"><h1 id="title">EduLog 報告編輯</h1><p id="label" class="label"></p></div>
  <button id="reload" class="icon" type="button" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <a id="open-tab" class="icon" target="_blank" rel="noopener noreferrer" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
</header>
<main class="panel-body">
  <section id="message" class="state" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><p id="message-text"></p><button id="allow" class="primary" type="button" hidden></button></section>
  <iframe id="editor" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
</main>
<script src="../shared/runtime-bridge.js"></script><script src="../shared/ui-core.js"></script><script src="../shared/ui-messages.js"></script><script src="../shared/ui-phrases.js"></script><script type="module" src="./panel.js"></script></body></html>
