<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduLog</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><span class="mark" aria-hidden="true">E</span><div><h1>EduLog</h1><p>教學系統擴充功能</p></div></header>
<section class="card ui-settings" aria-label="網站 UI 改善"><label class="switch" for="ui-enabled"><span>網站 UI 改善<small>無須連線 EduLog 即可使用</small></span><input id="ui-enabled" type="checkbox" checked></label><p id="ui-status" class="hint" role="status" aria-live="polite"></p></section>
<section id="connection-card" class="card" aria-label="EduLog 連線總覽"><div id="state-badge" class="badge" role="status" aria-live="polite">正在驗證連線</div><p id="state-detail" class="hint"></p><dl><div id="server-row" hidden><dt>連線網址</dt><dd id="server-value"></dd></div><div id="verified-row" hidden><dt>最近驗證</dt><dd id="verified-value"></dd></div></dl>
<div class="actions"><button id="open-settings" type="button" hidden>開啟整合設定</button><button id="retry" class="secondary" type="button" hidden>重新檢查</button><button id="change" class="text-button" type="button" hidden>變更伺服器</button></div><p id="settings-hint" class="hint" hidden>伺服器尚未提供整合設定連結，請更新 API 後重新檢查。</p></section>
<section id="feature-list" class="card" aria-label="整合功能" hidden><h2>整合功能</h2><div class="feature"><strong>教學資料匯入</strong><span>目前版本尚未支援</span></div><div class="feature"><strong>報告預填</strong><span>目前版本尚未支援</span></div></section>
<form id="server-form" class="card" novalidate hidden><h2 id="form-title">連接你的 EduLog</h2><label for="instance">EduLog 連線網址</label><input id="instance" type="url" inputmode="url" placeholder="https://edulog.example.com" autocomplete="url"><p class="hint">填入 API 可連線的自架網址；可使用自訂端口，開發時支援 localhost。</p><p id="change-hint" class="hint" hidden>連接不同伺服器後需重新配對；取消可保留目前連線。</p><button id="pair" type="submit">連接 EduLog</button><button id="cancel" class="secondary" type="button" hidden>取消</button></form>
<section id="pending-card" class="card" aria-label="等待核准" hidden><p id="pending-detail" class="hint"></p><button id="open-approval" class="secondary" type="button">開啟授權頁</button><button id="finish" type="button">完成核准配對</button></section>
<p id="status" role="status" aria-live="polite"></p><details id="diagnostics" class="card" hidden><summary>診斷資訊</summary><p id="diagnostic-text"></p></details><footer>整合憑證只用於 EduLog 專用 API，可在整合設定中撤銷。</footer>
</main><script src="runtime-bridge.js"></script><script src="connection-ui.js"></script><script type="module" src="popup.js"></script></body></html>
