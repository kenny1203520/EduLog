<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduLog</title><link rel="stylesheet" href="../styles/edulog-tokens.css"><link rel="stylesheet" href="./popup.css"></head><body>

<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
<symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

<symbol id="i-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>

<main class="popup">
<section id="main-view" aria-labelledby="brand">
<header class="popup-head"><span class="logo" aria-hidden="true">E</span><h1 id="brand" class="brand">EduLog</h1><span id="state-badge" class="conn" role="status" aria-live="polite" data-tone="neutral"><span class="dot" aria-hidden="true"></span><span id="state-label">驗證中</span></span><span class="spacer"></span><button id="open-settings-panel" class="btn btn-icon" type="button" aria-label="設定" data-i18n="popup.settings" data-i18n-attr="aria-label"><svg class="ic ic-lg" aria-hidden="true"><use href="#i-settings"/></svg></button></header>
<div id="connection-card" class="popup-body" data-state="checking">
<div class="ctx"><span id="context-icon" class="ctx-ic" aria-hidden="true"><svg class="ic ic-lg"><use id="context-use" href="#i-plug"/></svg></span><div class="ctx-text"><p id="context-title" class="ctx-title">正在驗證連線</p><p id="state-detail" class="ctx-sub">請稍候…</p></div></div>

<form id="server-form" class="stack" novalidate hidden><p id="form-title" class="form-title" hidden>變更伺服器</p><div class="field"><label for="instance">EduLog 連線網址</label><input id="instance" class="input" type="url" inputmode="url" placeholder="https://edulog.example.com" autocomplete="url"><p class="hint">自架網址可含端口；開發時支援 localhost。</p></div><details class="device"><summary>此瀏覽器的連線名稱</summary><div class="field"><label class="sr-only" for="device-name">此瀏覽器的連線名稱</label><input id="device-name" class="input" name="device_name" type="text" maxlength="80" autocomplete="off" placeholder="例如：教室筆電…"><p class="hint">名稱會顯示在 EduLog，方便辨識及撤銷連線。</p></div></details><p id="change-hint" class="hint" hidden>連接不同伺服器後需重新配對；取消可保留目前連線。</p><button id="pair" class="btn btn-primary btn-block" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-plug"/></svg><span id="pair-label">連接 EduLog</span></button><button id="cancel" class="btn btn-ghost" type="button" hidden>取消</button></form>

<div id="pending-card" class="stack" hidden><p id="pending-detail" class="hint"></p><button id="finish" class="btn btn-primary btn-block" type="button">完成核准配對</button><button id="open-approval" class="btn btn-ghost" type="button"><svg class="ic" aria-hidden="true"><use href="#i-external"/></svg>開啟授權頁</button></div>

<div id="feature-list" class="stack" hidden><button id="primary-action" class="btn btn-primary btn-block" type="button"><svg class="ic" aria-hidden="true"><use id="primary-icon" href="#i-dashboard"/></svg><span id="primary-label">開啟工作台</span></button><button id="open-workspace" class="btn btn-ghost" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-dashboard"/></svg>開啟工作台</button><p id="feature-hint" class="hint" role="status" hidden></p></div>

<button id="retry" class="btn btn-secondary btn-block" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>重新檢查</button>
<p id="status" role="status" aria-live="polite"></p>
<details id="diagnostics" hidden><summary>診斷資訊</summary><p id="diagnostic-text"></p></details>
</div>
<footer id="work-row" class="popup-foot" hidden><button id="open-work" class="linkrow" type="button"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg><span>工作紀錄</span><span id="work-count" class="count" hidden></span><svg class="ic chev" aria-hidden="true"><use href="#i-chev-right"/></svg></button></footer>
</section>

<section id="settings-view" aria-labelledby="settings-title" hidden>
<header class="popup-head"><button id="close-settings" class="btn btn-icon" type="button" aria-label="返回"><svg class="ic ic-lg" aria-hidden="true"><use href="#i-chev-left"/></svg></button><h1 id="settings-title" class="brand">設定</h1></header>
<div class="popup-body">
<div class="field"><span class="lbl">網站主題</span><label class="switch" for="ui-enabled"><span>套用 EduLog 清晰主題<small>白灰底 · 藍色操作；無須連線即可使用</small></span><input id="ui-enabled" type="checkbox" checked></label><p id="ui-status" class="hint" role="status" aria-live="polite"></p></div>
<div class="field"><span class="lbl">語言</span><div id="popup-language"></div></div>
<div class="field"><span class="lbl">EduLog 伺服器</span><dl><div id="server-row" hidden><dt class="sr-only">連線網址</dt><dd id="server-value"></dd></div><div id="verified-row" hidden><dt>最近驗證</dt><dd id="verified-value"></dd></div><div id="device-row" hidden><dt>此瀏覽器的連線名稱</dt><dd id="device-value"></dd></div></dl><p id="settings-hint" class="hint" hidden>伺服器尚未提供整合設定連結，請更新 API 後重新檢查。</p><div class="actions"><button id="open-settings" class="btn btn-secondary btn-sm" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-external"/></svg>開啟整合設定</button><button id="change" class="btn btn-ghost btn-sm" type="button" hidden>變更伺服器</button></div></div>
<p class="hint">整合憑證只用於 EduLog 專用 API，可在整合設定中撤銷。</p>
</div>
</section>
</main><script src="../shared/runtime-bridge.js"></script><script src="../shared/ui-core.js"></script><script src="../shared/ui-messages.js"></script><script src="../shared/ui-phrases.js"></script><script src="../sites/orange-apple/core/lexicon.js"></script><script src="../shared/connection-ui.js"></script><script type="module" src="./popup.js"></script></body></html>
